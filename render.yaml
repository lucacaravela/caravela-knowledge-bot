services:
  - type: web
    name: caravela-knowledge-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python auth_secrets.py &&
      streamlit run app.py --server.port $PORT --server.address 0.0.0.0
      --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AFFINITY_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_DOMAIN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: AUTH_REDIRECT_URI
        sync: false
